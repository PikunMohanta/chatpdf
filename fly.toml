# Fly.io Configuration for PDFPixie Backend
app = "pdfpixie-backend"
primary_region = "sin"  # Singapore - change to your preferred region

# Kill signal and timeout
kill_signal = "SIGINT"
kill_timeout = "5s"

# Build configuration
[build]

# Environment variables
[env]
  PORT = "8080"
  ENVIRONMENT = "production"

# HTTP service configuration
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# VM resources
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Volume for persistent storage
[mounts]
  source = "pdfpixie_data"
  destination = "/data"