# PDFPixie application server block
# Serves built frontend assets and proxies API & WebSocket traffic to FastAPI/Socket.IO

server {
    listen 80 default_server;
    server_name _;

    # Frontend build output
    root /var/www/html;
    index index.html;

    # Allow larger uploads (PDFs)
    client_max_body_size 50M;

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Serve static files with caching
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # PDF worker should not be hashed; serve directly
    location = /pdf.worker.min.js {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback for frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint (served by backend) proxied through root by SPA fallback sometimes
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Direct endpoints (upload, pdf, etc.)
    location ~ ^/(upload|pdf|query) {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO / WebSocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Error pages
    error_page 404 /index.html; # Let SPA handle 404s
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        try_files /50x.html =500;
    }
}
