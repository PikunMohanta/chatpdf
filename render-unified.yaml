# Alternative: Single Service Deployment
# This deploys both frontend and backend as one unified service

services:
  - type: web
    name: pdfpixie-unified
    env: python
    buildCommand: |
      # Install Python dependencies
      cd backend && pip install -r requirements.txt
      # Install Node.js and build frontend
      cd ../frontend
      npm install
      npm run build
      # Move built frontend to backend directory
      cp -r dist ../backend/static
    startCommand: cd backend && python -m uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Persistent disk for data storage
    disk:
      name: pdfpixie-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: OPENROUTER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: ENVIRONMENT
        value: production
      # No need for VITE_API_URL since everything is same origin