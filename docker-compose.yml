# PDFPixie Production Docker Compose
# Uses existing Dockerfile with supervisor (Nginx + FastAPI in one container)
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pdfpixie-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfpixie}
      POSTGRES_USER: ${POSTGRES_USER:-pdfpixie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfpixie_password}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_AUTH_METHOD:-scram-sha-256}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfpixie_user} -d ${POSTGRES_DB:-pdfpixie}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pdfpixie-network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: pdfpixie-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pdfpixie-network

  # Main Application (Frontend + Backend in one container via supervisor)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdfpixie-app
    environment:
      # Application settings
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      
      # Database configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pdfpixie_user}:${POSTGRES_PASSWORD:-pdfpixie_password}@postgres:5432/${POSTGRES_DB:-pdfpixie}
      
      # Redis configuration
      - REDIS_URL=redis://redis:6379/0
      
      # AI & External APIs
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      
      # AWS configuration (optional)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - pdfpixie-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local

# Custom network for service communication
networks:
  pdfpixie-network:
    driver: bridge