services:
  # Unified Service - Backend serving both API and Frontend
  - type: web
    name: pdfpixie-unified
    env: python
    buildCommand: |
      # Install Python dependencies
      cd backend && pip install -r requirements.txt
      cd ..
      # Install Node.js and build frontend
      cd frontend
      npm install
      npm run build
      # Move built frontend to backend static directory
      cp -r dist ../backend/static
      echo "✅ Unified build complete"
    startCommand: cd backend && python -m uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Add persistent disk for data storage
    disk:
      name: pdfpixie-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: OPENROUTER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: ENVIRONMENT
        value: production

databases:
  # For now using SQLite, but you can add PostgreSQL later
  # - name: pdfpixie-db
