services:
  # Backend API Service
  - type: web
    name: pdfpixie-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Add persistent disk for data storage
    disk:
      name: pdfpixie-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OPENROUTER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: ENVIRONMENT
        value: production
    
  # Frontend Service
  - type: web
    name: pdfpixie-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        value: https://pdfpixie-backend.onrender.com

databases:
  # For now using SQLite, but you can add PostgreSQL later
